security:
    password_hashers:
        App\Entity\User: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            logout: true

    access_control:
        - { path: ^/health, roles: PUBLIC_ACCESS }
        - { path: ^/saml, roles: PUBLIC_ACCESS }
        - { path: ^/metadata, roles: PUBLIC_ACCESS }
