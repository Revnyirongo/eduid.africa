server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/idp.crt;
    ssl_certificate_key /etc/nginx/certs/idp.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # SimpleSAMLphp front controller + static assets
    location /simplesaml/ {
        alias /var/www/app/vendor/simplesamlphp/simplesamlphp/public/;
        index index.php;
        try_files $uri $uri/ /simplesaml/index.php?$query_string;
    }

    location ~ ^/simplesaml/(?<phpfile>[^/]+\.php)(?<pathinfo>/.*)?$ {
        alias /var/www/app/vendor/simplesamlphp/simplesamlphp/public/$phpfile;
        include fastcgi_params;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SCRIPT_FILENAME /var/www/app/vendor/simplesamlphp/simplesamlphp/public/$phpfile;
        fastcgi_param SCRIPT_NAME /simplesaml/$phpfile;
        fastcgi_param PATH_INFO $pathinfo;
        fastcgi_pass app:9000;
    }

    # Symfony (app) front controller
    location / {
        include fastcgi_params;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param SCRIPT_FILENAME /var/www/app/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/app/public;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass app:9000;
    }
}
