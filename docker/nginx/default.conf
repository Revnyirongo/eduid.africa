server {
    listen 80;
    server_name eduid.africa idpname.eduid.africa *.eduid.africa idpuni.localhost university.localhost localhost;

    # Force HTTPS to avoid SimpleSAML secure-cookie errors
    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name eduid.africa idpname.eduid.africa *.eduid.africa idpuni.localhost university.localhost;

    ssl_certificate     /etc/nginx/certs/idp.crt;
    ssl_certificate_key /etc/nginx/certs/idp.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location /simplesaml/ {
        proxy_pass http://app:8080/simplesaml/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header HTTPS on;
        proxy_set_header X-Forwarded-Port $server_port;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header HTTPS on;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
