services:
  nginx:
    image: nginx:1.25-alpine
    depends_on:
      - app
    ports:
      - "${IDP_EXTERNAL_HTTP_PORT:-8080}:80"
      - "${IDP_EXTERNAL_HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/modern/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

  app:
    image: managedidp-app:local
    build:
      context: .
      dockerfile: docker/modern/app/Dockerfile
      network: host
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-prod}
      APP_DEBUG: ${APP_DEBUG:-0}
      SIMPLESAMLPHP_CONFIG_DIR: /var/www/conf/simplesamlphp
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?serverVersion=16&charset=utf8"
      DATABASE_VERSION: "16"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DATABASE_DRIVER: pdo_pgsql
      SAMLIDP_HOSTNAME: ${SAMLIDP_HOSTNAME:-idpuni.localhost}
      TRUSTED_PROXIES: "127.0.0.1,REMOTE_ADDR"
      TRUSTED_HOSTS: "^.+$"
      MAILER_SENDER: ${MAILER_SENDER:-noreply@example.org}
      MAILER_DSN: ${MAILER_DSN:-null://null}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app_var:/var/www/app/var
      - ./conf/simplesamlphp:/var/www/conf/simplesamlphp:ro
      - ./certs:/var/www/certs

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
  app_var:
