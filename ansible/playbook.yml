---
- name: Deploy ManagedIdP (single modern stack)
  hosts: managed_idp
  become: true
  vars:
    docker_packages:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    docker_arch_map:
      x86_64: amd64
      aarch64: arm64
      armv7l: armhf
    docker_repo_arch: "{{ docker_arch_map.get(ansible_facts['architecture'], ansible_facts['architecture']) }}"

  tasks:
    - name: Install base packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
          - openssl
        update_cache: yes

    - name: Add Docker GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repo
      apt_repository:
        repo: "deb [arch={{ docker_repo_arch }}] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
        state: present

    - name: Install Docker engine and compose plugin
      apt:
        name: "{{ docker_packages }}"
        update_cache: yes

    - name: Ensure Docker is running
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Ensure Docker config directory exists
      file:
        path: /etc/docker
        state: directory
        mode: "0755"

    - name: Configure Docker daemon DNS servers
      copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "dns": {{ docker_dns_servers | to_json }}
          }
      notify: Restart Docker

    - name: Flush handlers so Docker DNS config is active
      meta: flush_handlers

    - name: Verify host DNS can resolve deb.debian.org
      command: getent hosts deb.debian.org
      changed_when: false

    - name: Ensure app directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Ensure SSH directory exists for app user
      file:
        path: "/home/{{ app_user }}/.ssh"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0700"

    - name: Trust GitLab host key for app user
      known_hosts:
        path: "/home/{{ app_user }}/.ssh/known_hosts"
        name: gitlab.ubuntunet.net
        key: "{{ lookup('pipe', 'ssh-keyscan -H gitlab.ubuntunet.net 2>/dev/null') }}"
      become_user: "{{ app_user }}"

    - name: Clone repo
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}/repo"
        version: "{{ repo_version }}"
        force: true
        accept_hostkey: true
      become_user: "{{ app_user }}"

    - name: Write .env
      template:
        src: env.j2
        dest: "{{ app_dir }}/repo/.env"
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0600"

    - name: Ensure certs directory exists
      file:
        path: "{{ app_dir }}/repo/certs"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ app_user }}"
        mode: "0755"

    - name: Generate self-signed TLS cert (optional)
      command: >
        openssl req -x509 -nodes -newkey rsa:2048
        -keyout {{ app_dir }}/repo/certs/idp.key
        -out {{ app_dir }}/repo/certs/idp.crt
        -days {{ cert_days }}
        -subj "/CN={{ idp_common_name }}"
        -addext "subjectAltName=DNS:{{ idp_common_name }},DNS:{{ idp_base_domain }}"
      args:
        creates: "{{ app_dir }}/repo/certs/idp.crt"
      when: generate_self_signed | bool

    - name: Start stack
      command: docker compose -f {{ compose_file }} up -d --build
      args:
        chdir: "{{ app_dir }}/repo"
      environment:
        DOCKER_BUILDKIT: "{{ docker_buildkit }}"
        COMPOSE_DOCKER_CLI_BUILD: "{{ compose_docker_cli_build }}"

  handlers:
    - name: Restart Docker
      systemd:
        name: docker
        state: restarted
